name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs history
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm gates
      - uses: changesets/action@v2
        with:
          # docs/ARCHITECTURE.md embeds each package's version, so bumping
          # package.json without regenerating it makes graph:check fail on the
          # version PR. version:packages does both; changesets commits whatever
          # the version command leaves in the tree.
          # MUST stay a single token — the action runs this via @actions/exec
          # with no shell, so a literal `&&` here is passed as an argument
          # instead of chaining, and the bump silently produces nothing.
          version: pnpm version:packages
          publish: pnpm -r publish --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
